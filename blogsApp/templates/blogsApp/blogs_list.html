{% extends "blogsApp/base.html" %} 
{% load static %}

{% block title %} Blogs List {% endblock %}

{% block head %}   
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Cairo', sans-serif;
    }
    .blog-card img {
      height: 220px;
      object-fit: cover;
    }
    .navbar-brand {
      font-weight: bold;
    }
  </style>
{% endblock %}


{% block content %}

  <div class="container my-5">
    <h2 class="text-center mb-4">Blogs List</h2>
    <div class="row g-4">

      {% for blog in BlogList%}
      <div class="col-md-4">
        <div class="card blog-card shadow-sm">
          <img src="{{blog.image.url}}" class="card-img-top" alt="Blog Image">
          <div class="card-body">
            <h5 class="card-title">{{blog.title}}</h5>
            <p class="card-text text-muted">
              {{blog.content}}
            </p>
            <a href="{% url "blog" blog.slug %}" class="btn btn-primary btn-sm">Read More</a>
          </div>
          <div class="card-footer text-muted small">
            <i class="bi bi-calendar"></i> 
          </div>
        </div>
      </div>
      {%endfor%}

     

    </div>
  </div>

  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
{% endblock %}
