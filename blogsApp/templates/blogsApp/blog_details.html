{% extends "blogsApp/base.html" %} 
{% load static %}


{% block title %} {{blog.title}} {% endblock %}

{% block head %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Cairo', sans-serif;
    }
    .blog-header img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
    }
    .blog-content {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .blog-category {
    display: inline-block;
    margin-right: 6px;
    margin-bottom: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    text-decoration: none;
    transition: 0.3s;
    }
    .blog-category:hover {
      transform: translateY(-2px);
    }
    .comment-box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
{% endblock %}

{% block content %}

  <div class="container my-5">
    <div class="blog-header mb-4">
      <img src="{{blog.image.url}}" alt="Blog Image">
    </div>

    <div class="blog-content">
      <h2 class="mb-3">{{blog.title}}</h2>
      <div class="text-muted mb-4">
        <i class="bi bi-calendar"></i> {{blog.date}}
      </div>

      <div class="mb-4">

      {% for category in blog.category.all %}

        <a href="{% url 'blogs_by_category' category.slug %}"
          class="btn btn-outline-primary blog-category">
          {{ category.category }}
        </a>

      {% endfor %}

    </div>

      {{blog.content}}
    </div>

  </div>

  
{% endblock %}
